[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-call-graph-explorer"
version = "0.1.0"
description = "A local web app for exploring Python call graphs from unfamiliar files."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAI Codex" }
]
license = { text = "Proprietary" }
keywords = ["python", "ast", "call-graph", "code-reading", "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
]
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.repo]
test-command = "python -m unittest discover -s tests -v"
run-command = "python run.py --repo-root fixtures/sample_repo --target-file fixtures/sample_repo/pkg/main.py"
dev-script = "python scripts/dev.py"

